name: Build Shiori APK

on:
  workflow_dispatch:
  push:
    branches: [devel]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install required Android packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Cache preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shiori-preview-signing-v1

      - name: Run unit tests and build debug APK
        run: bash gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test novel reader on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.koitharu.kotatsu.novels.NovelReaderAndroidTest
            mkdir -p ui-screenshots
            adb pull /sdcard/Pictures/ShioriTests/. ui-screenshots/ || echo "::warning::Optional UI screenshots were not retained after testing"

      - name: Upload UI verification screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: ui-screenshots/*.png
          if-no-files-found: warn

      - name: Build signed personal release
        run: bash gradlew --no-daemon :app:assembleRelease

      - name: Upload Shiori APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiori-final
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
